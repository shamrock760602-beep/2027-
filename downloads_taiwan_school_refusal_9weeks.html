<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聽懂拒學：九週解構與跨界倡議互動網頁</title>
    <style>
        /* Neo-Brutalism & Origami Outline Aesthetic */
        :root {
            --bg-color: #f0ede5;
            --main-dark: #1a1a1a;
            --border-width: 4px;
            --shadow-offset: 8px;
            
            /* Role Colors */
            --color-student: #ffb703; /* Yellow */
            --color-parent: #8ecae6;  /* Blue */
            --color-pro: #84a98c;     /* Green */
            --color-core: #ff7e67;    /* Orange */
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--main-dark);
            margin: 0; padding: 0;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* Left Sidebar: 9 Weeks Navigation */
        .sidebar {
            width: 320px;
            background: #fff;
            border-right: var(--border-width) solid var(--main-dark);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: var(--border-width) solid var(--main-dark);
            background: var(--main-dark);
            color: #fff;
        }
        .sidebar-header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; font-weight: 900; }
        .sidebar-header p { margin: 8px 0 0 0; font-size: 14px; opacity: 0.8; }

        .week-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            list-style: none;
            margin: 0;
        }

        .week-item {
            padding: 16px;
            margin-bottom: 12px;
            border: 2px solid var(--main-dark);
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            position: relative;
        }

        .week-item:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--main-dark);
        }

        .week-item.active {
            background: var(--color-core);
            color: #fff;
            border-width: 3px;
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--main-dark);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 100% 100%, #e3e0d8 0%, var(--bg-color) 100%);
        }

        /* Progress Header */
        .progress-header {
            padding: 24px 40px;
            border-bottom: var(--border-width) solid var(--main-dark);
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .progress-bar-container {
            width: 300px;
            height: 20px;
            border: 3px solid var(--main-dark);
            background: #fff;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--color-core);
            width: 11.11%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Content Viewport */
        .viewport {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-card {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border: var(--border-width) solid var(--main-dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--main-dark);
            position: relative;
            padding: 40px;
            margin-bottom: 40px;
        }

        /* Origami Fold Corner */
        .origami-fold {
            position: absolute;
            top: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 45px 45px 0;
            border-color: transparent var(--main-dark) transparent transparent;
        }
        .origami-fold::after {
            content: '';
            position: absolute;
            top: -45px; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 41px 41px 0;
            border-color: transparent #fff transparent transparent;
        }

        .theme-title { font-size: 36px; font-weight: 900; margin: 0 0 10px 0; }
        .theme-subtitle { font-size: 20px; color: #555; margin: 0 0 24px 0; padding-bottom: 24px; border-bottom: 2px dashed var(--main-dark); }
        .theme-context { font-size: 16px; line-height: 1.8; font-weight: 500; margin-bottom: 30px; }

        /* Role Selection Tabs */
        .role-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .role-btn {
            flex: 1;
            padding: 16px;
            border: 3px solid var(--main-dark);
            background: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--main-dark);
            transition: all 0.2s ease;
            text-align: center;
        }
        .role-btn:hover { transform: translateY(-2px); }
        .role-btn.active[data-role="student"] { background: var(--color-student); color: #000; transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--main-dark); }
        .role-btn.active[data-role="parent"] { background: var(--color-parent); color: #000; transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--main-dark); }
        .role-btn.active[data-role="pro"] { background: var(--color-pro); color: #fff; transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--main-dark); }

        /* Role Content Area */
        .role-content-box {
            padding: 30px;
            border: 3px solid var(--main-dark);
            background: #fff;
            min-height: 250px;
        }
        .role-quote {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 20px 0;
            padding-left: 20px;
            border-left: 8px solid var(--main-dark);
            line-height: 1.5;
        }
        .role-desc {
            font-size: 17px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>聽懂拒學</h1>
            <p>九週解構與跨界倡議</p>
        </div>
        <ul class="week-list" id="weekList">
            <!-- Populated by JS -->
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="progress-header">
            <h2 id="headerWeekText" style="margin:0; font-weight: 900; font-size: 24px;">WEEK 1 / 9</h2>
            <div style="display:flex; align-items:center; gap: 16px;">
                <span style="font-weight: 800; font-size: 14px;">解構進度 (UDL Progression)</span>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>
        </header>

        <div class="viewport">
            <div class="content-card">
                <div class="origami-fold"></div>
                
                <h1 class="theme-title" id="themeTitle">Loading...</h1>
                <h3 class="theme-subtitle" id="themeSubtitle">Loading...</h3>
                <div class="theme-context" id="themeContext"></div>

                <div class="role-tabs">
                    <button class="role-btn active" data-role="student">🎒 學生視角</button>
                    <button class="role-btn" data-role="parent">🏠 家長視角</button>
                    <button class="role-btn" data-role="pro">🩺 專業工作者</button>
                </div>

                <div class="role-content-box" id="roleContentBox">
                    <h2 class="role-quote" id="roleQuote"></h2>
                    <p class="role-desc" id="roleDesc"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const weeksData = {"1": {"title": "W1 \u65b7\u5d16\u5d29\u89e3\uff1a\u529f\u7e3e\u4e3b\u7fa9\u4e0b\u7684\u795e\u7d93\u95dc\u6a5f", "subtitle": "\u70ba\u4f55\u62d2\u5b78\u88ab\u8996\u70ba\u300c\u554f\u984c\u300d\uff1f\u89e3\u69cb\u81fa\u7063\u55ae\u4e00\u5347\u5b78\u50f9\u503c\u89c0", "context": "\u5728\u81fa\u706315-18\u6b72\u7684\u9ad8\u4e2d\u8077\u9ad4\u5236\uff08\u6703\u8003\u3001\u5b78\u6e2c\uff09\u4e2d\uff0c\u793e\u6703\u7030\u6f2b\u8457\u300c\u842c\u822c\u7686\u4e0b\u54c1\uff0c\u552f\u6709\u8b80\u66f8\u9ad8\u300d\u7684\u529f\u7e3e\u4e3b\u7fa9\u8ff7\u601d\u3002\u7cfb\u7d71\u5c07\u300c\u4e0d\u53bb\u5b78\u6821\u300d\u5b9a\u8abf\u70ba\u6297\u58d3\u6027\u4f4e\u3001\u61f6\u60f0\u6216\u54c1\u884c\u554f\u984c\uff0c\u537b\u5ffd\u7565\u4e86\u9019\u662f\u9752\u5c11\u5e74\u9762\u5c0d\u55ae\u4e00\u8a55\u50f9\u9ad4\u7cfb\u904e\u8f09\u6642\uff0c\u795e\u7d93\u7cfb\u7d71\u70ba\u4e86\u907f\u514d\u5fb9\u5e95\u5d29\u6f70\u800c\u5f37\u5236\u555f\u52d5\u7684\u300c\u751f\u5b58\u95dc\u6a5f\u53cd\u61c9\u300d\u3002", "student": {"quote": "\u300c\u5982\u679c\u8003\u4e0d\u4e0a\u570b\u7acb\u5927\u5b78\uff0c\u6211\u7684\u4eba\u751f\u5c31\u6bc0\u4e86\u3002\u4f46\u6211\u73fe\u5728\u9023\u62ff\u8d77\u7b46\uff0c\u624b\u90fd\u5728\u767c\u6296\u3002\u300d", "content": "\u9762\u5c0d\u7121\u6b62\u76e1\u7684\u6392\u540d\u8207\u6a21\u8003\uff0c\u6211\u767c\u5c55\u51fa\u300e\u5047\u6211\u300f\u4f86\u8fce\u5408\u5927\u4eba\u3002\u7576\u80fd\u91cf\u8017\u76e1\uff0c\u6211\u7684\u8eab\u9ad4\u5148\u4e00\u6b65\u66ff\u6211\u8e29\u4e86\u715e\u8eca\u3002\u6211\u4e0d\u662f\u4e0d\u60f3\u52aa\u529b\uff0c\u800c\u662f\u6211\u771f\u7684\u300e\u7576\u6a5f\u300f\u4e86\u3002"}, "parent": {"quote": "\u300c\u89aa\u621a\u90fd\u5728\u554f\u4ed6\u8b80\u54ea\u500b\u9ad8\u4e2d\uff0c\u6211\u9023\u96fb\u8a71\u90fd\u4e0d\u6562\u63a5\u3002\u300d", "content": "\u6211\u6df1\u9677\u4e9e\u6d32\u793e\u6703\u7684\u300e\u9762\u5b50\u300f\u8207\u300e\u89aa\u8077\u7126\u616e\u300f\u4e2d\u3002\u5b78\u6821\u6bcf\u5929\u65e9\u4e0a\u6253\u4f86\u8981\u51fa\u52e4\u7d00\u9304\uff0c\u6211\u4e00\u65b9\u9762\u5fc3\u75bc\u5b69\u5b50\uff0c\u4e00\u65b9\u9762\u53c8\u6050\u61fc\u4ed6\u4e00\u65e6\u812b\u96e2\u300e\u5e38\u8ecc\u300f\uff0c\u9019\u8f29\u5b50\u5c31\u64bf\u89d2\uff08\u6c92\u6551\uff09\u4e86\u3002"}, "pro": {"quote": "\u300c\u4e0d\u8981\u6025\u8457\u958b\u7acb\u300e\u62d2\u5b78\u75c7\u300f\u7684\u8a3a\u65b7\u66f8\uff0c\u5148\u770b\u898b\u58d3\u8feb\u4ed6\u7684\u7d50\u69cb\u3002\u300d", "content": "\u7cbe\u795e\u79d1\u91ab\u5e2b/\u5fc3\u7406\u5e2b\u5e38\u9762\u81e8\u5b78\u6821\u8207\u5bb6\u9577\u7684\u58d3\u529b\uff0c\u8981\u6c42\u76e1\u5feb\u300e\u4fee\u597d\u300f\u5b69\u5b50\u9001\u56de\u9ad4\u5236\u3002\u6211\u5011\u5fc5\u9808\u61f8\u7f6e\u75c5\u7406\u5316\uff0c\u770b\u61c2\u9019\u662f\u7d50\u69cb\u6027\u8017\u7aed\uff08Burnout\uff09\uff0c\u63d0\u4f9b\u53bb\u5a01\u8105\u7684\u5e87\u8b77\u6240\u3002"}}, "2": {"title": "W2 \u5be6\u9ad4\u7e6d\u5c45\uff1a\u623f\u9593\u4f5c\u70ba\u6700\u5f8c\u7684\u9632\u7a7a\u6d1e", "subtitle": "\u4e9e\u6d32\u9ad8\u5bc6\u5ea6\u5c45\u4f4f\u7a7a\u9593\u8207\u9752\u5c11\u5e74\u7684\u908a\u754c\u4fdd\u885b\u6230", "context": "\u81fa\u7063\u5730\u72f9\u4eba\u7a20\uff0c\u9752\u5c11\u5e74\u5f80\u5f80\u7f3a\u4e4f\u7368\u7acb\u4e14\u4e0d\u53d7\u5e72\u64fe\u7684\u7a7a\u9593\u3002\u7576\u73fe\u5be6\u4e16\u754c\uff08\u5b78\u6821\u3001\u88dc\u7fd2\u73ed\uff09\u5168\u9762\u5931\u5b88\uff0c\u300c\u53cd\u9396\u7684\u623f\u9580\u300d\u8207\u300c\u65e5\u591c\u985b\u5012\u300d\u6210\u70ba\u4ed6\u5011\u5efa\u7acb\u7269\u7406\u8207\u5fc3\u7406\u908a\u754c\u7684\u6700\u5f8c\u624b\u6bb5\u3002\u7db2\u8def\u4e16\u754c\u5247\u63d0\u4f9b\u4e86\u7121\u8a55\u50f9\u5a01\u8105\u7684\u5b58\u5728\u8b49\u660e\u3002", "student": {"quote": "\u300c\u53ea\u6709\u5728\u534a\u591c\u4e09\u9ede\uff0c\u5927\u5bb6\u90fd\u7761\u8457\u7684\u6642\u5019\uff0c\u6211\u624d\u89ba\u5f97\u547c\u5438\u662f\u81ea\u7531\u7684\u3002\u300d", "content": "\u6211\u628a\u9580\u9396\u4e0a\uff0c\u56e0\u70ba\u5916\u9762\u7684\u4e16\u754c\u5145\u6eff\u4e86\u300e\u4f60\u4ec0\u9ebc\u6642\u5019\u8981\u53bb\u5b78\u6821\u300f\u7684\u8996\u7dda\u3002\u904a\u6232\u88e1\u6211\u53ea\u8981\u6253\u602a\u5c31\u6709\u7d93\u9a57\u503c\uff0c\u4f46\u5728\u73fe\u5be6\u88e1\uff0c\u6211\u600e\u9ebc\u505a\u90fd\u662f\u932f\u7684\u3002"}, "parent": {"quote": "\u300c\u4ed6\u628a\u9580\u9396\u4e86\u4e09\u500b\u6708\uff0c\u6211\u53ea\u80fd\u628a\u98ef\u83dc\u653e\u5728\u9580\u53e3\uff0c\u50cf\u5728\u990a\u5e7d\u9748\u3002\u300d", "content": "\u6050\u614c\u8207\u5931\u63a7\u611f\u8b93\u6211\u60f3\u8981\u62d4\u6389\u7db2\u8def\u7dda\u3001\u62c6\u6389\u9580\u9396\u3002\u6211\u5bb3\u6015\u4ed6\u8b8a\u6210\u793e\u6703\u65b0\u805e\u88e1\u7684\u300e\u5543\u8001\u65cf\u300f\uff0c\u9019\u7a2e\u6050\u61fc\u8b93\u6211\u5e38\u5728\u9580\u5916\u5931\u63a7\u5486\u54ee\u3002"}, "pro": {"quote": "\u300c\u7834\u9580\u800c\u5165\u4e0d\u662f\u62ef\u6551\uff0c\u800c\u662f\u6467\u6bc0\u4ed6\u6700\u5f8c\u7684\u5b89\u5168\u611f\u3002\u300d", "content": "\u793e\u5de5\u8207\u8aee\u5546\u5e2b\u5fc5\u9808\u5b88\u4f4f\u9019\u9053\u300e\u623f\u9580\u300f\u3002\u6211\u5011\u6559\u5c0e\u5bb6\u9577\u5c0a\u91cd\u908a\u754c\uff0c\u5efa\u7acb\u9580\u7e2b\u7d19\u689d\u3001LINE\u8cbc\u5716\u7b49\u300e\u975e\u540c\u6b65/\u4f4e\u58d3\u529b\u300f\u7684\u63a5\u89f8\uff0c\u5148\u628a\u91cd\u5fc3\u8f49\u56de\u7167\u9867\u7236\u6bcd\u81ea\u8eab\u7684\u5598\u606f\u3002"}}, "3": {"title": "W3 \u62d2\u7d55\u5e6b\u52a9\uff1a\u7576\u5c08\u696d\u4eba\u54e1\u6210\u70ba\u9ad4\u5236\u7684\u8aaa\u5ba2", "subtitle": "\u95dc\u4fc2\u5275\u50b7\u8207\u300c\u6211\u4e0d\u9700\u8981\u5e6b\u5fd9\u300d\u7684\u9632\u885b\u6a5f\u5236", "context": "\u8a31\u591a\u62d2\u5b78\u9752\u5e74\u5c0d\u8aee\u5546\u5e2b\u3001\u793e\u5de5\u6216\u91ab\u5e2b\u62b1\u6301\u6975\u5927\u6575\u610f\u3002\u56e0\u70ba\u5728\u4ed6\u5011\u7684\u7d93\u9a57\u4e2d\uff0c\u5927\u4eba\u7684\u300c\u5e6b\u52a9\u300d\u5f80\u5f80\u5e36\u6709\u689d\u4ef6\u2014\u2014\u300c\u5e6b\u4f60\u6574\u7406\u60c5\u7dd2\uff0c\u662f\u70ba\u4e86\u8b93\u4f60\u8d95\u5feb\u56de\u5b78\u6821\u300d\u3002\u7576\u5c08\u696d\u4eba\u54e1\u8207\u58d3\u8feb\u9ad4\u5236\u639b\u9264\uff0c\u9752\u5c11\u5e74\u7684\u62d2\u7d55\u5c31\u6210\u70ba\u4e00\u7a2e\u4e3b\u9ad4\u6027\u7684\u62b5\u6297\u3002", "student": {"quote": "\u300c\u4f60\u5011\u90fd\u4e00\u6a23\uff0c\u8aaa\u8981\u807d\u6211\u8aaa\u8a71\uff0c\u6700\u5f8c\u9084\u4e0d\u662f\u53eb\u6211\u56de\u5b78\u6821\u9762\u5c0d\u3002\u300d", "content": "\u6211\u88ab\u9738\u51cc\u6642\u5b78\u6821\u6c92\u6709\u63a5\u4f4f\u6211\u3002\u73fe\u5728\u4f60\u5011\u6d3e\u5fc3\u7406\u5e2b\u4f86\uff0c\u53ea\u662f\u60f3\u89e3\u6c7a\u6211\u9019\u500b\u300e\u9ebb\u7169\u300f\u3002\u53ea\u8981\u6211\u8aaa\u300e\u6211\u5f88\u597d\uff0c\u4e0d\u9700\u8981\u5e6b\u5fd9\u300f\uff0c\u4f60\u5011\u5c31\u7121\u6cd5\u63a7\u5236\u6211\u3002"}, "parent": {"quote": "\u300c\u639b\u4e86\u865f\u4ed6\u4e0d\u80af\u53bb\u91ab\u9662\uff0c\u8acb\u4e86\u5fc3\u7406\u5e2b\u4ed6\u6454\u9580\u4e0d\u898b\uff0c\u6211\u9084\u80fd\u600e\u9ebc\u8fa6\uff1f\u300d", "content": "\u6975\u5ea6\u7684\u7121\u529b\u611f\u3002\u89ba\u5f97\u5b69\u5b50\u628a\u6240\u6709\u60f3\u5e6b\u4ed6\u7684\u4eba\u90fd\u63a8\u958b\uff0c\u5bb6\u9577\u593e\u5728\u300e\u60f3\u6551\u5b69\u5b50\u300f\u8207\u300e\u88ab\u5b69\u5b50\u62d2\u7d55\u300f\u7684\u96d9\u91cd\u75db\u82e6\u4e2d\uff0c\u9010\u6f38\u5c0d\u5c08\u696d\u9ad4\u7cfb\u5931\u53bb\u4fe1\u5fc3\u3002"}, "pro": {"quote": "\u300c\u6211\u5011\u5fc5\u9808\u5148\u80cc\u53db\u9ad4\u5236\u7684\u671f\u5f85\uff0c\u624d\u80fd\u8d0f\u5f97\u9752\u5c11\u5e74\u7684\u4fe1\u4efb\u3002\u300d", "content": "\u5fc5\u9808\u660e\u78ba\u5ba3\u544a\uff1a\u300e\u6211\u4e0d\u4ee3\u8868\u5b78\u6821\uff0c\u6211\u4e0d\u662f\u4f86\u52f8\u4f60\u5fa9\u5b78\u7684\u3002\u300f\u63a1\u53d6\u5275\u50b7\u77e5\u60c5\u7167\u8b77\uff0c\u627f\u8a8d\u9ad4\u5236\u7684\u5931\u9748\uff0c\u6210\u70ba\u5b69\u5b50\u53ef\u4fe1\u8cf4\u7684\u4ee3\u7406\u5021\u8b70\u8005\uff0c\u800c\u975e\u6821\u65b9\u7684\u7cfe\u5bdf\u968a\u3002"}}, "4": {"title": "W4 \u5fa9\u5b78\u5e7b\u8c61\uff1a\u56de\u5230\u5b78\u6821\uff0c\u5c31\u662f\u597d\u4e86\u55ce\uff1f", "subtitle": "\u89e3\u69cb\u300c\u5fa9\u5b78\uff1d\u5fa9\u539f\u300d\u7684\u55ae\u4e00\u6307\u6a19\u8ff7\u601d", "context": "\u9ad4\u5236\u5e38\u5c07\u300c\u6210\u529f\u5fa9\u5b78\u300d\u8996\u70ba\u7d50\u6848\u6a19\u6e96\u3002\u7136\u800c\uff0c\u82e5\u74b0\u5883\u7684\u58d3\u529b\u6e90\u672a\u89e3\uff0c\u52c9\u5f37\u8fd4\u6821\u5f80\u5f80\u5c0e\u81f4\u66f4\u56b4\u91cd\u7684\u300c\u4e8c\u6b21\u5d29\u6f70\u300d\u3002\u6211\u5011\u5fc5\u9808\u6253\u7834\u4ee5\u51fa\u52e4\u7387\u4f5c\u70ba\u552f\u4e00\u5065\u5eb7\u6307\u6a19\u7684\u601d\u7dad\u3002", "student": {"quote": "\u300c\u6211\u7a7f\u4e0a\u5236\u670d\u8d70\u5230\u6821\u9580\u53e3\uff0c\u5c31\u5410\u4e86\u3002\u6211\u597d\u6c92\u7528\uff0c\u9023\u9019\u9ede\u4e8b\u90fd\u505a\u4e0d\u5230\u3002\u300d", "content": "\u70ba\u4e86\u4e0d\u8b93\u7238\u5abd\u5931\u671b\uff0c\u6211\u52c9\u5f37\u81ea\u5df1\u51fa\u9580\u3002\u4f46\u5750\u5728\u6559\u5ba4\u88e1\uff0c\u6211\u89ba\u5f97\u81ea\u5df1\u50cf\u500b\u900f\u660e\u7684\u7570\u985e\uff0c\u540c\u5b78\u7684\u773c\u795e\u50cf\u91dd\u3002\u6490\u4e86\u4e09\u5929\uff0c\u6211\u5d29\u6f70\u5f97\u6bd4\u4e4b\u524d\u66f4\u5fb9\u5e95\u3002"}, "parent": {"quote": "\u300c\u4ed6\u660e\u660e\u6628\u5929\u90fd\u53bb\u4e86\uff0c\u70ba\u4ec0\u9ebc\u4eca\u5929\u53c8\u8aaa\u8d77\u4e0d\u4f86\uff1f\u662f\u4e0d\u662f\u88dd\u7684\uff1f\u300d", "content": "\u5fc3\u60c5\u50cf\u5750\u96f2\u9704\u98db\u8eca\u3002\u770b\u5230\u5b69\u5b50\u4e0a\u5b78\u5c31\u9b06\u4e00\u53e3\u6c23\uff0c\u9694\u5929\u4e0d\u53bb\u53c8\u8dcc\u5165\u8c37\u5e95\u3002\u7dca\u6293\u8457\u300e\u5fa9\u5b78\u300f\u7684\u57f7\u5ff5\uff0c\u8b93\u6211\u5011\u7121\u6cd5\u770b\u898b\u5b69\u5b50\u5176\u5be6\u9084\u6c92\u6e96\u5099\u597d\u3002"}, "pro": {"quote": "\u300c\u51fa\u52e4\u7387\u662f\u5047\u8c61\uff0c\u8eab\u5fc3\u5bb9\u53d7\u5ea6\u624d\u662f\u771f\u5be6\u7684\u5fa9\u539f\u6307\u6a19\u3002\u300d", "content": "\u505c\u6b62\u5c07\u5fa9\u5b78\u4f5c\u70ba\u8655\u9047\u76ee\u6a19\u3002\u8207\u5b78\u6821\u8f14\u5c0e\u5ba4\u5354\u8abf\uff0c\u653e\u5bec\u5c0d\u500b\u6848\u7684\u671f\u5f85\u3002\u6211\u5011\u61c9\u8a72\u8a55\u4f30\u7684\u662f\uff1a\u5b69\u5b50\u662f\u5426\u958b\u59cb\u9858\u610f\u51fa\u9580\u8cb7\u4fbf\u7576\uff1f\u662f\u5426\u80fd\u8ac7\u8ad6\u672a\u4f86\uff1f"}}, "5": {"title": "W5 \u53e6\u985e\u8def\u5f91\uff1a\u96e2\u958b\u5b78\u6821\u4ee5\u5f8c\uff0c\u5b78\u7fd2\u9084\u5728\u55ce\uff1f", "subtitle": "\u81ea\u5b78\u3001\u8077\u63a2\u8207\u81fa\u7063\u6559\u80b2\u591a\u5143\u8f49\u929c\u7684\u7126\u616e", "context": "\u81fa\u7063\u96d6\u6709\u300a\u5be6\u9a57\u6559\u80b2\u4e09\u6cd5\u300b\uff0c\u4f46\u591a\u6578\u5bb6\u5ead\u5c0d\u300c\u975e\u6b63\u898f\u5347\u5b78\u300d\u4ecd\u5145\u6eff\u672a\u77e5\u8207\u6050\u61fc\u3002\u7576\u6211\u5011\u5e36\u9818\u62d2\u5b78\u5bb6\u5ead\u63a2\u7d22\u500b\u4eba\u81ea\u5b78\u3001\u6280\u8853\u578b\u9ad8\u4e2d\uff08\u9ad8\u8077\uff09\u8f49\u929c\u6216\u793e\u5340\u5b78\u7fd2\u6642\uff0c\u9762\u81e8\u7684\u662f\u5c0d\u6297\u6574\u500b\u793e\u6703\u5c0d\u300c\u6b63\u7d71\u5b78\u6b77\u300d\u7684\u5d07\u62dc\u3002", "student": {"quote": "\u300c\u5982\u679c\u6211\u4e0d\u62ff\u9ad8\u4e2d\u7562\u696d\u8b49\u66f8\uff0c\u4ee5\u5f8c\u9084\u80fd\u627e\u5230\u5de5\u4f5c\u55ce\uff1f\u300d", "content": "\u96e2\u958b\u5b78\u6821\u8b93\u6211\u9b06\u4e86\u4e00\u53e3\u6c23\uff0c\u4f46\u9f90\u5927\u7684\u5c0d\u672a\u4f86\u7684\u6050\u61fc\u96a8\u4e4b\u800c\u4f86\u3002\u6211\u958b\u59cb\u5617\u8a66\u81ea\u5b78\u526a\u8f2f\u548c\u756b\u5716\uff0c\u4f46\u7e3d\u89ba\u5f97\u81ea\u5df1\u662f\u4e0d\u5165\u6d41\u7684\u908a\u7de3\u4eba\u3002"}, "parent": {"quote": "\u300c\u8fa6\u81ea\u5b78\uff1f\u90a3\u6211\u5011\u4ee5\u5f8c\u8981\u600e\u9ebc\u8003\u5927\u5b78\uff1f\u89aa\u621a\u554f\u8d77\u4f86\u600e\u9ebc\u8aaa\uff1f\u300d", "content": "\u7d93\u6b77\u4e86\u6495\u88c2\u8207\u60b2\u50b7\u5f8c\uff0c\u88ab\u8feb\u653e\u4e0b\u5c0d\u5efa\u4e2d\u3001\u5317\u4e00\u5973\u3001\u53f0\u6210\u6e05\u4ea4\u7684\u57f7\u5ff5\u3002\u4f46\u9762\u5c0d\u81ea\u5df1\u898f\u5283\u5b78\u7fd2\uff0c\u5bb6\u9577\u5f80\u5f80\u56e0\u70ba\u7f3a\u4e4f\u8cc7\u6e90\u8207\u524d\u4f8b\uff0c\u611f\u5230\u6975\u5ea6\u5b64\u7acb\u3002"}, "pro": {"quote": "\u300c\u6211\u5011\u4e0d\u53ea\u6cbb\u7652\u5275\u50b7\uff0c\u9084\u8981\u64d4\u4efb\u6559\u80b2\u8def\u5f91\u7684\u300e\u8cc7\u6e90\u8f49\u8b6f\u8005\u300f\u3002\u300d", "content": "\u5fc3\u7406\u5e2b\u8207\u793e\u5de5\u5fc5\u9808\u8de8\u51fa\u6cbb\u7642\u5ba4\uff0c\u4e86\u89e3\u81fa\u7063\u7684\u5be6\u9a57\u6559\u80b2\u6cd5\u898f\u3001\u81ea\u5b78\u7533\u8acb\u6d41\u7a0b\u8207\u9752\u5e74\u8077\u6daf\u767c\u5c55\u4e2d\u5fc3\u8cc7\u6e90\uff0c\u70ba\u5bb6\u5ead\u5a92\u5408\u53bb\u5a01\u8105\u6027\u7684\u5b78\u7fd2\u7ba1\u9053\u3002"}}, "6": {"title": "W6 \u91cd\u65b0\u5b9a\u7fa9\u5fa9\u539f\uff1a\u5728\u793e\u6703\u4e2d\u627e\u5230\u5fae\u5c0f\u7acb\u8db3\u9ede", "subtitle": "\u6253\u5de5\u3001\u793e\u5718\u8207\u975e\u5178\u578b\u793e\u6703\u5316\u7684\u5145\u80fd", "context": "\u5982\u679c\u5b69\u5b50\u6c92\u6709\u56de\u5230\u5b78\u6821\uff0c\u4f46\u4ed6\u958b\u59cb\u53bb\u8d85\u5546\u6253\u5de5\u3001\u53c3\u52a0\u684c\u904a\u5e97\u805a\u6703\u3001\u6216\u9858\u610f\u5b78\u7fd2\u4e00\u9805\u6280\u80fd\uff0c\u6211\u5011\u80fd\u4e0d\u80fd\u627f\u8a8d\u9019\u5c31\u662f\u4e00\u7a2e\u300c\u5fa9\u539f\u300d\uff1f\u672c\u9031\u63a2\u8a0e\u793e\u6703\u5316\u8207\u81ea\u6211\u6548\u80fd\u7684\u91cd\u5efa\u3002", "student": {"quote": "\u300c\u5728\u8d85\u5546\u6253\u5de5\u96d6\u7136\u7d2f\uff0c\u4f46\u5e97\u9577\u8aaa\u6211\u8ca8\u6392\u5f97\u5f88\u597d\uff0c\u90a3\u662f\u6211\u4e09\u5e74\u4f86\u7b2c\u4e00\u6b21\u88ab\u7a31\u8b9a\u3002\u300d", "content": "\u6211\u767c\u73fe\u5b78\u6821\u4ee5\u5916\u7684\u4e16\u754c\uff0c\u4e0d\u662f\u53ea\u6709\u8003\u8a66\u5206\u6578\u3002\u900f\u904e\u8cfa\u53d6\u5fae\u8584\u7684\u85aa\u6c34\u548c\u9762\u5c0d\u5ba2\u4eba\uff0c\u6211\u6162\u6162\u89ba\u5f97\u81ea\u5df1\u662f\u4e00\u500b\u300e\u6709\u7528\u300f\u7684\u4eba\uff0c\u4e0d\u518d\u662f\u5ee2\u7269\u3002"}, "parent": {"quote": "\u300c\u4ed6\u9858\u610f\u51fa\u9580\u53bb\u8d85\u5546\u4e0a\u73ed\u4e86\uff0c\u4f46\u6211\u9084\u662f\u5728\u60f3\uff0c\u4ed6\u4ec0\u9ebc\u6642\u5019\u624d\u8981\u56de\u53bb\u628a\u66f8\u5538\u5b8c\uff1f\u300d", "content": "\u770b\u898b\u5b69\u5b50\u6709\u7b11\u5bb9\u5f88\u6b23\u6170\uff0c\u4f46\u5167\u5fc3\u6df1\u8655\u7684\u300e\u5b78\u6b77\u7126\u616e\u300f\u4ecd\u672a\u6d88\u9664\u3002\u9700\u8981\u5b78\u7fd2\u771f\u6b63\u63a5\u7d0d\uff1a\u9019\u53ef\u80fd\u5c31\u662f\u5b69\u5b50\u73fe\u968e\u6bb5\u6700\u9069\u5408\u7684\u751f\u5b58\u65b9\u5f0f\u3002"}, "pro": {"quote": "\u300c\u5fa9\u539f\uff0c\u662f\u9010\u6f38\u6709\u80fd\u529b\u5728\u5012\u4e0b\u4e4b\u5f8c\uff0c\u518d\u627e\u5230\u4e0b\u4e00\u6b65\uff0c\u800c\u4e0d\u662f\u6c38\u9060\u4e0d\u518d\u5012\u4e0b\u3002\u300d", "content": "\u5354\u52a9\u5bb6\u9577\u770b\u898b\u300e\u751f\u6d3b\u9069\u61c9\u300f\u5927\u65bc\u300e\u5b78\u696d\u9069\u61c9\u300f\u3002\u70ba\u9752\u5c11\u5e74\u5efa\u7acb\u7a69\u5b9a\u7684\u5fae\u578b\u793e\u6703\u652f\u6301\u7db2\u7d61\uff0c\u8b93\u4ed6\u5011\u5728\u7121\u8a55\u50f9\u7684\u74b0\u5883\u4e2d\u91cd\u65b0\u9577\u51fa\u529b\u91cf\u3002"}}, "7": {"title": "W7 \u7cfb\u7d71\u8017\u7aed\uff1a\u8ab0\u6709\u8cc7\u683c\u6162\u6162\u597d\u8d77\u4f86\uff1f", "subtitle": "\u5bb6\u5ead\u52d5\u529b\u7684\u91cd\u7d44\u8207\u968e\u7d1a\u8cc7\u6e90\u7684\u6b98\u9177\u73fe\u5be6", "context": "\u300c\u7d66\u5b69\u5b50\u6642\u9593\u300d\u662f\u4e00\u53e5\u5e38\u898b\u7684\u5b89\u6170\uff0c\u4f46\u6642\u9593\u9700\u8981\u91d1\u9322\u8207\u8cc7\u6e90\u652f\u6490\u3002\u7d93\u6fdf\u5f31\u52e2\u5bb6\u5ead\u7121\u6cd5\u8ca0\u64d4\u7236\u6bcd\u8acb\u5047\u966a\u4f34\u3001\u81ea\u8cbb\u5fc3\u7406\u8aee\u5546\u6216\u6602\u8cb4\u7684\u81ea\u5b78\u8ab2\u7a0b\u3002\u62d2\u5b78\uff0c\u5f80\u5f80\u63ed\u9732\u4e86\u6b98\u9177\u7684\u968e\u7d1a\u7279\u6b0a\u3002", "student": {"quote": "\u300c\u770b\u8457\u7238\u5abd\u70ba\u4e86\u6211\u7684\u4e8b\u5435\u67b6\u3001\u70ba\u4e86\u9322\u767c\u6101\uff0c\u6211\u89ba\u5f97\u81ea\u5df1\u4e0d\u5982\u6b7b\u6389\u7b97\u4e86\u3002\u300d", "content": "\u6211\u77e5\u9053\u5bb6\u88e1\u6c92\u6709\u9322\u8b93\u6211\u6162\u6162\u4f11\u606f\u3002\u6211\u6bcf\u5929\u90fd\u5728\u5167\u759a\uff0c\u89ba\u5f97\u81ea\u5df1\u662f\u5bb6\u88e1\u7684\u5bc4\u751f\u87f2\uff0c\u9019\u7a2e\u7f6a\u60e1\u611f\u8b93\u6211\u66f4\u6c92\u6709\u529b\u91cf\u7ad9\u8d77\u4f86\u3002"}, "parent": {"quote": "\u300c\u5fc3\u7406\u5e2b\u8aaa\u8981\u591a\u966a\u4f34\uff0c\u4f46\u6211\u5982\u679c\u4e0d\u53bb\u5de5\u5730/\u8f2a\u73ed\uff0c\u5168\u5bb6\u90fd\u8981\u559d\u897f\u5317\u98a8\u3002\u300d", "content": "\u592b\u59bb\u70ba\u4e86\u8ab0\u8981\u8acb\u5047\u7167\u9867\u5b69\u5b50\u5f15\u767c\u5a5a\u59fb\u5371\u6a5f\uff1b\u624b\u8db3\u7684\u8cc7\u6e90\u88ab\u56b4\u91cd\u6392\u64e0\u3002\u6211\u5011\u9023\u751f\u5b58\u90fd\u6709\u56f0\u96e3\uff0c\u54ea\u4f86\u7684\u9918\u88d5\u53bb\u8ac7\u300e\u5fc3\u7406\u7a7a\u9593\u300f\uff1f"}, "pro": {"quote": "\u300c\u4e0d\u8981\u7d66\u4e88\u5ffd\u8996\u968e\u7d1a\u73fe\u5be6\u7684\u5ec9\u50f9\u5b89\u6170\uff0c\u5f15\u5165\u793e\u653f\u8207\u52a9\u5b78\u8cc7\u6e90\u662f\u7b2c\u4e00\u8981\u52d9\u3002\u300d", "content": "\u52a9\u4eba\u8005\u5fc5\u9808\u5177\u5099\u793e\u6703\u5b78\u89ba\u5bdf\u3002\u5728\u6703\u8ac7\u5916\uff0c\u7a4d\u6975\u9023\u7d50\u6025\u96e3\u6551\u52a9\u3001\u5f31\u52e2\u52a9\u5b78\u8a08\u756b\u8207\u9577\u7167\u5598\u606f\u670d\u52d9\uff0c\u5c07\u8655\u9047\u5c0d\u8c61\u5f9e\u300e\u500b\u6848\u300f\u64f4\u5927\u5230\u300e\u6574\u500b\u5bb6\u5ead\u300f\u3002"}}, "8": {"title": "W8 \u8de8\u7db2\u7e2b\u5408\uff1a\u4e00\u500b\u5b69\u5b50\u9700\u8981\u591a\u5c11\u4eba\uff1f", "subtitle": "\u6253\u7834\u5c08\u696d\u672c\u4f4d\u4e3b\u7fa9\u7684 IEP \u8207\u500b\u6848\u6703\u8b70\u5354\u4f5c", "context": "\u62d2\u5b78\u5bb6\u5ead\u5e38\u5728\u6559\u80b2\uff08\u8f14\u5c0e\u5ba4\uff09\u3001\u91ab\u7642\uff08\u8eab\u5fc3\u79d1\uff09\u8207\u793e\u653f\uff08\u793e\u798f\u4e2d\u5fc3\uff09\u4e4b\u9593\u6d41\u6d6a\uff0c\u5404\u7cfb\u7d71\u76ee\u6a19\u4e0d\u4e00\u3002\u6211\u5011\u9700\u8981\u5f9e\u55ae\u5175\u4f5c\u6230\u8f49\u5411\u751f\u614b\u7cfb\u7d71\u7684\u8de8\u7db2\u7d61\u5354\u4f5c\uff08Systemic Collaboration\uff09\u3002", "student": {"quote": "\u300c\u91ab\u751f\u958b\u85e5\u3001\u8001\u5e2b\u8981\u6211\u56de\u5b78\u6821\u3001\u793e\u5de5\u554f\u6211\u5bb6\u88e1\u72c0\u6cc1...\u4f60\u5011\u80fd\u4e0d\u80fd\u5148\u7d71\u4e00\u53e3\u5f91\uff1f\u300d", "content": "\u6211\u611f\u89ba\u81ea\u5df1\u50cf\u4e00\u500b\u88ab\u8e22\u4f86\u8e22\u53bb\u7684\u76ae\u7403\uff0c\u6bcf\u500b\u4eba\u90fd\u7528\u4ed6\u5011\u7684\u5c08\u696d\u8996\u89d2\u770b\u6211\uff0c\u4f46\u6c92\u6709\u4eba\u771f\u7684\u770b\u898b\u300e\u6211\u300f\u9019\u500b\u5b8c\u6574\u7684\u4eba\u3002"}, "parent": {"quote": "\u300c\u6211\u6bcf\u5929\u90fd\u5728\u5404\u500b\u6a5f\u69cb\u9593\u50b3\u8a71\uff0c\u6211\u53ea\u662f\u4e00\u500b\u5abd\u5abd\uff0c\u70ba\u4ec0\u9ebc\u8981\u61c2\u9019\u9ebc\u591a\u5c08\u696d\u8853\u8a9e\uff1f\u300d", "content": "\u75b2\u65bc\u5954\u547d\u7684\u500b\u6848\u7ba1\u7406\u54e1\u3002\u5fc5\u9808\u540c\u6642\u61c9\u4ed8\u5b78\u6821\u7684\u901a\u5831\u58d3\u529b\u3001\u91ab\u751f\u7684\u56de\u8a3a\u8981\u6c42\uff0c\u9084\u8981\u9762\u5c0d\u89aa\u621a\u7684\u6307\u6307\u9ede\u9ede\uff0c\u7cfb\u7d71\u7684\u788e\u88c2\u52a0\u91cd\u4e86\u5bb6\u5ead\u7684\u8ca0\u64d4\u3002"}, "pro": {"quote": "\u300c\u53ec\u958b\u8de8\u7db2\u7d61\u500b\u6848\u6703\u8b70\uff0c\u6210\u70ba\u8cc7\u6e90\u7684\u8f49\u8b6f\u8005\u8207\u7e2b\u5408\u8005\u3002\u300d", "content": "\u5c08\u696d\u5de5\u4f5c\u8005\u5fc5\u9808\u4e3b\u52d5\u6253\u7834\u5efa\u5236\u9ad8\u7246\u3002\u6574\u5408\u5404\u65b9\u671f\u5f85\uff0c\u5c07\u300e\u5fa9\u5b78KPI\u300f\u8f49\u5316\u70ba\u300e\u8eab\u5fc3\u7a69\u5b9a\u6307\u6a19\u300f\uff0c\u78ba\u4fdd\u5bb6\u5ead\u63a5\u53d7\u5230\u7684\u662f\u4e00\u81f4\u4e14\u5177\u5099\u4fdd\u8b77\u6027\u7684\u652f\u6301\u7db2\u7d61\u3002"}}, "9": {"title": "W9 \u5341\u516b\u6b72\u4e4b\u5f8c\uff1a\u9752\u5e74\u8f49\u929c\u8207\u793e\u6703\u91cd\u5851", "subtitle": "\u9577\u5927\u4e0d\u7b49\u65bc\u6e96\u5099\u597d\uff1a\u9ad8\u4e2d\u7562\u696d\u5f8c\u7684\u96b1\u5f62\u5371\u6a5f", "context": "\u793e\u6703\u5e38\u4ee5\u70ba\u62d2\u5b78\u662f\u300c\u570b\u9ad8\u4e2d\u751f\u300d\u7684\u5c08\u5229\u3002\u7136\u800c\uff0c\u7576\u9019\u7fa4\u5b69\u5b50\u6eff18\u6b72\uff0c\u5931\u53bb\u7fa9\u52d9\u6559\u80b2\u7cfb\u7d71\u7684\u4fdd\u8b77\u7db2\u5f8c\uff0c\u5728\u5927\u5b78\u8f49\u929c\u3001\u4f11\u9000\u5b78\u6216\u9032\u5165\u8077\u5834\u6642\uff0c\u5e38\u9762\u81e8\u66f4\u5b64\u7acb\u7121\u63f4\u7684\u300c\u4e8c\u6b21\u9000\u7e2e\u300d\u3002\u5021\u8b70\u7684\u7d42\u5c40\uff0c\u662f\u793e\u6703\u7684\u91cd\u5851\u3002", "student": {"quote": "\u300c18\u6b72\u751f\u65e5\u904e\u5f8c\uff0c\u9ad4\u5236\u8aaa\u6211\u662f\u6210\u5e74\u4eba\u4e86\uff0c\u4f46\u6211\u5fc3\u88e1\u90a3\u500b\u5bb3\u6015\u7684\u5c0f\u5b69\u9084\u5728\u3002\u300d", "content": "\u52c9\u5f37\u6df7\u5230\u9ad8\u4e2d\u7562\u696d\uff0c\u4f46\u5927\u5b78\u662f\u53e6\u4e00\u500b\u66f4\u9f90\u5927\u3001\u66f4\u51b7\u6f20\u7684\u9ad4\u5236\u3002\u6c92\u6709\u4e86\u8f14\u5c0e\u5ba4\uff0c\u7576\u6211\u518d\u6b21\u6050\u614c\u767c\u4f5c\u6642\uff0c\u6211\u5b8c\u5168\u4e0d\u77e5\u9053\u8a72\u53bb\u54ea\u88e1\u3002"}, "parent": {"quote": "\u300c\u4ee5\u70ba\u4ed6\u9ad8\u4e2d\u7562\u696d\u5c31\u6c92\u4e8b\u4e86\uff0c\u7d50\u679c\u5927\u5b78\u5538\u4e86\u534a\u5b78\u671f\u53c8\u8eb2\u56de\u623f\u9593\uff0c\u9019\u6b21\u6c92\u4eba\u5e6b\u6211\u5011\u4e86\u3002\u300d", "content": "\u770b\u8457\u540c\u9f61\u7684\u5b69\u5b50\u90fd\u5728\u8ac7\u6200\u611b\u3001\u51fa\u570b\u3001\u5be6\u7fd2\uff0c\u6211\u7684\u5b69\u5b50\u537b\u505c\u6eef\u4e0d\u524d\u3002\u9752\u5e74\u671f\u7684\u62d2\u5b78\uff0c\u8b93\u7236\u6bcd\u7684\u9000\u4f11\u8a08\u756b\u8207\u990a\u8001\u671f\u5f85\u5fb9\u5e95\u8499\u4e0a\u9670\u5f71\u3002"}, "pro": {"quote": "\u300c\u5021\u8b70\u4e0d\u80fd\u505c\u572818\u6b72\uff0c\u5efa\u7acb\u6210\u5e74\u8f49\u929c\uff08Transition to Adulthood\uff09\u7684\u652f\u6301\u7db2\u7d61\u662f\u4e0b\u4e00\u500b\u6230\u5834\u3002\u300d", "content": "\u628a\u4e03\u5e74\u7684\u73fe\u5834\u5de5\u4f5c\u7d93\u9a57\u8f49\u8b6f\u70ba\u793e\u6703\u8ad6\u8ff0\u3002\u63a8\u52d5\u5927\u5b78\u7aef\u7684\u5fc3\u7406\u652f\u6301\u5f48\u6027\u5316\u3001\u53cb\u5584\u8077\u5834\u904e\u6e21\u8a08\u756b\u3002\u5c07\u500b\u6848\u7684\u751f\u547d\u7d93\u9a57\uff0c\u5316\u70ba\u6539\u8b8a\u793e\u6703\u9ad4\u5236\u7684\u5021\u8b70\u529b\u91cf\u3002"}}};
        let currentWeek = 1;
        let currentRole = 'student';

        const weekListEl = document.getElementById('weekList');
        const themeTitleEl = document.getElementById('themeTitle');
        const themeSubtitleEl = document.getElementById('themeSubtitle');
        const themeContextEl = document.getElementById('themeContext');
        const roleQuoteEl = document.getElementById('roleQuote');
        const roleDescEl = document.getElementById('roleDesc');
        const roleBtns = document.querySelectorAll('.role-btn');
        const progressBar = document.getElementById('progressBar');
        const headerWeekText = document.getElementById('headerWeekText');
        const roleContentBox = document.getElementById('roleContentBox');

        // Initialize Sidebar
        function initSidebar() {
            Object.keys(weeksData).forEach(week => {
                const li = document.createElement('li');
                li.className = 'week-item' + (week == 1 ? ' active' : '');
                li.dataset.week = week;
                li.innerHTML = weeksData[week].title.split('：')[0]; // Just show "W1 斷崖崩解"
                li.onclick = () => selectWeek(week);
                weekListEl.appendChild(li);
            });
        }

        function selectWeek(week) {
            currentWeek = week;
            
            // Update Sidebar UI
            document.querySelectorAll('.week-item').forEach(el => {
                el.classList.toggle('active', el.dataset.week == week);
            });

            // Update Progress
            const percentage = (week / 9) * 100;
            progressBar.style.width = percentage + '%';
            headerWeekText.textContent = `WEEK ${week} / 9`;

            // Update Content
            const data = weeksData[week];
            themeTitleEl.textContent = data.title;
            themeSubtitleEl.textContent = data.subtitle;
            themeContextEl.textContent = data.context;

            updateRoleContent();
        }

        function selectRole(role) {
            currentRole = role;
            roleBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
            updateRoleContent();
        }

        function updateRoleContent() {
            const data = weeksData[currentWeek][currentRole];
            roleQuoteEl.textContent = data.quote;
            roleDescEl.innerHTML = data.content;
            
            // Change border color based on role
            if(currentRole === 'student') roleContentBox.style.borderColor = 'var(--color-student)';
            if(currentRole === 'parent') roleContentBox.style.borderColor = 'var(--color-parent)';
            if(currentRole === 'pro') roleContentBox.style.borderColor = 'var(--color-pro)';
        }

        // Bind Role Buttons
        roleBtns.forEach(btn => {
            btn.onclick = () => selectRole(btn.dataset.role);
        });

        // Run Init
        initSidebar();
        selectWeek(1);
    </script>
</body>
</html>
